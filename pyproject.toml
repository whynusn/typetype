[project]
name = "typetype"
version = "0.4.5"
description = "Cross-platform Chinese typing practice app built with PySide6 and QML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.4.0",
    "cryptography>=46.0.5",
    "darkdetect>=0.8.0",
    "elevate>=0.1.3",
    "evdev>=1.9.2; platform_system == 'Linux'",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pycryptodome>=3.23.0",
    "pyobjc-framework-cocoa>=11.0; platform_system == 'Darwin'",
    "pyobjc-framework-quartz>=11.0; platform_system == 'Darwin'",
    "pyside6>=6.10.2",
    "pyside6-addons>=6.10.2",
    "pywin32>=310; platform_system == 'Windows'",
    "qasync>=0.28.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.0",
    "pytest>=9.0.3",
    "pytest-qt>=4.4.0",
    "pyyaml>=6.0",
    "ruff>=0.15.12",
]

[tool.ruff]
exclude = ["RinUI"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
